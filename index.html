<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pa'l Filo está en mantenimiento. Volvemos pronto.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0919">
  <link rel="icon" href="IMG/favicon.png?v=8" type="image/png">
  <title>En mantenimiento · Pa'l Filo</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/index.css?v=8">
</head>
<body>
  <!-- Fondo: noche costeña con rayos suaves y nubes -->
  <div class="cielo" aria-hidden="true">
    <div class="rayos"></div>
    <div class="puntos"></div>
    <svg class="nube n1" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n2" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n3" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n4" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n5" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n6" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n7" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n8" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n9" viewBox="0 0 200 100"><use href="#nube"/></svg>
    <svg class="nube n10" viewBox="0 0 200 100"><use href="#nube"/></svg>
  </div>

  <main class="puerta">
    <span class="logo"><img src="IMG/Logo-palfilo-icono.png?v=8" alt="Pa'l Filo, Colombian street food"></span>

    <!-- Cartel colgado: se mece suavemente -->
    <div class="colgante">
      <div class="clavo" aria-hidden="true"></div>
      <svg class="cuerda" viewBox="0 0 300 70" aria-hidden="true"><path d="M150 6 L46 68 M150 6 L254 68" fill="none" stroke="#0D0919" stroke-width="6" stroke-linecap="round"/></svg>
      <section class="cartel">
        <span class="ups">¡Ups!</span>
        <h1>Sitio en<br>mantenimiento</h1>
        <p>Estamos haciendo algunas mejoras.<br>Vuelve pronto.</p>
        <div class="cinta" aria-hidden="true"></div>
      </section>
    </div>

    <!-- Slider: los antojos aparecen uno por uno -->
    <div class="slider" aria-hidden="true">
      <div class="ventana"><img class="emo" id="emo" src="IMG/Iconos/pizza.svg?v=8" alt=""></div>
    </div>

    <nav class="redes" aria-label="Redes sociales">
      <span>Síguenos</span>
      <a href="https://www.instagram.com/tazmaniafoodoficial/" target="_blank" rel="noopener" aria-label="Instagram de Pa'l Filo"><img src="IMG/Redes/instagram.png?v=8" alt="" width="40" height="40"></a>
      <a href="https://www.facebook.com/p/Tazmania-Food-61559588588174/" target="_blank" rel="noopener" aria-label="Facebook de Pa'l Filo"><img src="IMG/Redes/facebook.png?v=8" alt="" width="40" height="40"></a>
    </nav>
  </main>

  <p class="pie">Pa'l Filo · Colombian street food · San José, California · <span id="anio"></span></p>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="nube" viewBox="0 0 200 100">
        <path d="M40 88c-20 0-32-12-30-28 2-15 16-24 30-21 4-18 20-30 40-28 16 2 28 12 32 26 6-6 16-9 26-6 16 5 24 20 20 34 14 2 22 12 20 23H40z" fill="#FFF1DC" stroke="#0D0919" stroke-width="6" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <script src="JS/index.js?v=8"></script>
</body>
</html>
