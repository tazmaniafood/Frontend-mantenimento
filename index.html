<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TAZ Fast Food está remodelando su página. Volvemos pronto.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6efe2">
  <link rel="icon" href="IMG/Logo-taz.png?v=2" type="image/png">
  <title>En mantenimiento · TAZ Fast Food</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/index.css?v=2">
</head>
<body>
  <div class="papel" aria-hidden="true"></div>

  <main class="puerta">
    <img class="logo" src="IMG/Logo-taz-trans.png?v=2" alt="TAZ Fast Food, hecho en Colombia">

    <!-- Cartel colgado de la puerta: se mece suavemente -->
    <div class="colgante">
      <div class="clavo" aria-hidden="true"></div>
      <svg class="cuerda" viewBox="0 0 300 90" aria-hidden="true"><path d="M150 6 L40 88 M150 6 L260 88" fill="none" stroke="#3a2a1c" stroke-width="4" stroke-linecap="round"/></svg>
      <section class="pizarra">
        <p class="tiza-top">Lo sentimos, estamos</p>
        <h1>Remodelando<br>la cocina</h1>
        <p class="tiza">Volvemos pronto con todo el sabor 🇨🇴</p>
      </section>
    </div>

    <!-- Herramientas trabajando -->
    <div class="taller" aria-hidden="true">
      <svg class="engrane g1" viewBox="0 0 100 100"><use href="#gear"/></svg>
      <svg class="engrane g2" viewBox="0 0 100 100"><use href="#gear"/></svg>
      <svg class="engrane g3" viewBox="0 0 100 100"><use href="#gear"/></svg>
    </div>

    <ol class="checklist" aria-label="Lo que estamos haciendo">
      <li class="ok">Nuevo menú con fotos</li>
      <li class="ok">Arma tu pizza a tu gusto</li>
      <li class="now">Afinando los últimos detalles</li>
      <li>¡Abrir la puerta de nuevo!</li>
    </ol>

    <nav class="redes" aria-label="Redes sociales">
      <span>Mientras tanto, síguenos</span>
      <a href="https://www.instagram.com/tazmaniafoodoficial/" target="_blank" rel="noopener" aria-label="Instagram de TAZ Fast Food"><img src="IMG/Redes/instagram.png?v=2" alt="" width="40" height="40"></a>
      <a href="https://www.facebook.com/p/Tazmania-Food-61559588588174/" target="_blank" rel="noopener" aria-label="Facebook de TAZ Fast Food"><img src="IMG/Redes/facebook.png?v=2" alt="" width="40" height="40"></a>
    </nav>
  </main>

  <p class="pie">TAZ Fast Food · Servido en San José, California · <span id="anio"></span></p>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="gear" viewBox="0 0 100 100">
        <path d="M43 4h14l2 12a35 35 0 0 1 9 4l10-7 10 10-7 10a35 35 0 0 1 4 9l12 2v14l-12 2a35 35 0 0 1-4 9l7 10-10 10-10-7a35 35 0 0 1-9 4l-2 12H43l-2-12a35 35 0 0 1-9-4l-10 7-10-10 7-10a35 35 0 0 1-4-9L3 57V43l12-2a35 35 0 0 1 4-9l-7-10 10-10 10 7a35 35 0 0 1 9-4z" fill="currentColor"/>
        <circle cx="50" cy="50" r="14" fill="var(--fondo)"/>
      </symbol>
    </defs>
  </svg>

  <script src="JS/index.js?v=2"></script>
</body>
</html>
