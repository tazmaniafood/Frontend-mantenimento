<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pa'l Filo está en mantenimiento. Volvemos pronto.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D0919">
  <link rel="icon" href="IMG/favicon.png?v=10" type="image/png">
  <title>En mantenimiento · Pa'l Filo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/palfilo.css?v=10">
  <link rel="stylesheet" href="Styles/mantenimiento.css?v=10">
</head>
<body>
  <main class="puerta">
    <img class="puerta__logo" src="IMG/Marca/logo-horizontal.png?v=10" alt="Pa'l Filo, Colombian street food" width="640" height="247">

    <div class="colgante">
      <span class="colgante__clavo" aria-hidden="true"></span>
      <svg class="colgante__cuerda" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"><path d="M150 4 L48 64 M150 4 L252 64" fill="none" stroke="#FFF1DC" stroke-width="5" stroke-linecap="round"/></svg>
      <section class="cartel" aria-labelledby="titulo">
        <span class="cartel__ups plana">¡Ups!</span>
        <h1 id="titulo" class="letrero">Sitio en<br>mantenimiento</h1>
        <p>Estamos haciendo algunas mejoras. Vuelve pronto.</p>
        <span class="cartel__cinta" aria-hidden="true"></span>
      </section>
    </div>

    <div class="aro" aria-hidden="true"><img class="aro__antojo" id="emo" src="IMG/Iconos/pizza-neon.svg?v=10" alt=""></div>

    <nav class="redes" aria-label="Redes sociales">
      <span class="redes__titulo plana">Síguenos</span>
      <a class="btn btn--secundario btn--chico" href="https://www.instagram.com/tazmaniafoodoficial/" target="_blank" rel="noopener"><img src="IMG/Redes/instagram.png?v=10" alt="" width="22" height="22">Instagram</a>
      <a class="btn btn--secundario btn--chico" href="https://www.facebook.com/p/Tazmania-Food-61559588588174/" target="_blank" rel="noopener"><img src="IMG/Redes/facebook.png?v=10" alt="" width="22" height="22">Facebook</a>
    </nav>
  </main>

  <footer class="pie--mant">Pa'l Filo · Colombian street food · San José, California · <span id="anio"></span></footer>

  <script src="JS/index.js?v=10"></script>
</body>
</html>
